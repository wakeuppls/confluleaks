[metadata]
name = confluleaks
version = attr: scanner.__version__
description = Read-only secret scanner for Confluence
author = wakeuppls
license = Apache-2.0
license_files =
    LICENSE
    NOTICE
url = https://github.com/wakeuppls/confluleaks
project_urls =
    Source = https://github.com/wakeuppls/confluleaks
    Issues = https://github.com/wakeuppls/confluleaks/issues
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Topic :: Security

[options]
packages =
    confluleaks
    scanner
python_requires = >=3.9
install_requires =
    requests>=2.31,<3
    PyYAML>=6,<7
    urllib3>=1.26,<3
    regex>=2024.11.6
include_package_data = True

[options.package_data]
scanner =
    default_rules.yaml

[options.entry_points]
console_scripts =
    confluleaks = scanner.main:main
