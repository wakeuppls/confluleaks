[metadata]
name = confluleaks
version = attr: scanner.__version__
description = Read-only secret scanner for Confluence
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Topic :: Security

[options]
packages =
    confluleaks
    scanner
python_requires = >=3.9
install_requires =
    requests>=2.31,<3
    PyYAML>=6,<7
    urllib3>=1.26,<3
include_package_data = True

[options.package_data]
scanner =
    default_rules.yaml

[options.entry_points]
console_scripts =
    confluleaks = scanner.main:main
