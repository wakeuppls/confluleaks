version: 1

# URL and authentication secrets can be overridden through environment
# variables. Never store a token or password in this file.
url: https://confluence.example.com/confluence
auth: bearer
# For an internal CA, point to a readable PEM bundle instead of disabling TLS
# verification. Relative paths are resolved from this file's directory.
# ca_bundle: certificates/company-ca.pem

# Omit rules to use the built-in pack. Relative custom paths are resolved from
# this configuration file's directory.
# rules: organization-rules.yaml
# baseline: state/confluence-baseline.json
format: text

spaces:
  - ENG
exclude_spaces: []
include_personal_spaces: false
include_archived_spaces: false

history: false
comments: false
attachments: false

page_size: 50
timeout: 20
retries: 3
backoff: 0.5
request_delay: 0
# progress: true  # automatic on interactive terminals
# log_file: logs/confluleaks.log
# log_level: debug
# show_secrets: false  # unsafe: writes plaintext matches to the report

# Uncomment these for a deliberately bounded pilot. Reaching max_pages marks
# the result as incomplete; history_limit automatically enables history.
# max_pages: 100
# history_limit: 5
max_attachment_size_mb: 5
max_response_size_mb: 16
max_document_size_mb: 5
regex_timeout: 0.25
max_findings: 10000
max_findings_per_document: 1000
max_runtime: 3600

continue_on_error: false
fail_on: high
