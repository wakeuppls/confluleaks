name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project
        run: python -m pip install .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q confluleaks scanner tests

  package:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Install and smoke-test wheel
        shell: bash
        run: |
          python -m venv /tmp/confluleaks-release-check
          /tmp/confluleaks-release-check/bin/python -m pip install dist/*.whl
          /tmp/confluleaks-release-check/bin/confluleaks --version
          /tmp/confluleaks-release-check/bin/python - <<'PY'
          from importlib.resources import files

          rules = files("scanner").joinpath("default_rules.yaml")
          if not rules.is_file():
              raise SystemExit("default_rules.yaml is missing from the wheel")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: confluleaks-dist
          path: dist/*
          if-no-files-found: error
